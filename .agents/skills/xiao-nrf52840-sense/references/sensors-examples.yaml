  code: "// DHT11 Temperature & Humidity Sensor - XIAO\n#include <DHT.h>\n\n#define DHTPIN 2      // Connect DHT11 data pin to XIAO pin 2\n#define DHTTYPE DHT11\n\nDHT dht(DHTPIN, DHTTYPE);\n\nvoid setup()\
    \ {\n  Serial.begin(115200);\n  while (!Serial) { delay(10); }\n  Serial.println(\"DHT11 Sensor Reading\");\n  dht.begin();\n}\n\nvoid loop() {\n  delay(2000);  // DHT11 needs at least 1 second between\
    \ readings\n\n  float humidity = dht.readHumidity();\n  float temperature = dht.readTemperature();\n\n  if (isnan(humidity) || isnan(temperature)) {\n    Serial.println(\"Failed to read from DHT sensor!\"\
    );\n    return;\n  }\n\n  float heatIndex = dht.computeHeatIndex(temperature, humidity, false);\n\n  Serial.print(\"Temperature: \"); Serial.print(temperature, 1); Serial.println(\" °C\"); Serial.print(\"\
    Humidity: \"); Serial.print(humidity, 1); Serial.print(\" \"); Serial.print(\"%\"); Serial.println(); \n  Serial.print(\"Heat Index: \"); Serial.print(heatIndex, 1); Serial.println(\" °C\"); Serial.println(\"\
    ---\");\n}\n"
  requirements:
  - DHT sensor library
  wikiUrl: https://wiki.seeedstudio.com/Grove-Temperature-Humidity-Sensor-DHT11/
