  code: "// IMU Sensor - XIAO nRF52840 Sense (LSM6DS3TR-C)\n#include <Adafruit_LSM6DS3TRC.h>\n\nAdafruit_LSM6DS3TRC lsm6ds3;\n\nvoid setup() {\n  Serial.begin(115200);\n  while (!Serial) { delay(10); }\n\
    \n  if (!lsm6ds3.begin_I2C()) {\n    Serial.println(\"Failed to find LSM6DS3TR-C chip\");\n    while (1) { delay(10); }\n  }\n\n  Serial.println(\"LSM6DS3TR-C Found!\");\n  lsm6ds3.setAccelRange(LSM6DS3_ACCEL_RANGE_2_G);\n\
    \  lsm6ds3.setGyroRange(LSM6DS3_GYRO_RANGE_250_DPS);\n}\n\nvoid loop() {\n  sensors_event_t accel, gyro, temp;\n  lsm6ds3.getEvent(&accel, &gyro, &temp);\n\n  Serial.print(\"Accel X: \"); Serial.print(accel.acceleration.x,\
    \ 2); Serial.print(\", Y: \"); Serial.print(accel.acceleration.y, 2); Serial.print(\", Z: \"); Serial.print(accel.acceleration.z, 2); Serial.println(\" m/s^2\"); Serial.print(\"Gyro X: \"); Serial.print(gyro.gyro.x,\
    \ 2); Serial.print(\", Y: \"); Serial.print(gyro.gyro.y, 2); Serial.print(\", Z: \"); Serial.print(gyro.gyro.z, 2); Serial.println(\" rad/s\"); Serial.print(\"Temp: \"); Serial.print(temp.temperature,\
    \ 1); Serial.println(\" °C\"); Serial.println(\"---\");\n  delay(100);\n}\n"
  requirements:
  - Adafruit LSM6DS3TR-C
  wikiUrl: https://wiki.seeedstudio.com/XIAO-BLE-Sense-Getting-Started/
