  code: "// Soil Moisture Sensor - XIAO\n// Connect sensor analog output to A0\n\n#define SENSOR_PIN A0\n#define DRY_VALUE 3200    // ADC reading when completely dry\n#define WET_VALUE 1400    // ADC reading\
    \ when submerged in water\n\nvoid setup() {\n  Serial.begin(115200);\n  while (!Serial) { delay(10); }\n  Serial.println(\"Soil Moisture Sensor Example\");\n}\n\nvoid loop() {\n  int rawValue = analogRead(SENSOR_PIN);\n\
    \n  // Map to percentage (0% = dry, 100% = wet)\n  int moisturePercent = map(rawValue, DRY_VALUE, WET_VALUE, 0, 100);\n  moisturePercent = constrain(moisturePercent, 0, 100);\n\n  Serial.print(\"Raw\
    \ ADC: \"); Serial.print(rawValue); Serial.print(\" | Moisture: \"); Serial.print(moisturePercent); Serial.print(\"%\"); Serial.println();\n\n  if (moisturePercent < 30) {\n    Serial.println(\"Soil\
    \ is dry - needs watering!\");\n  } else if (moisturePercent > 70) {\n    Serial.println(\"Soil is very wet\");\n  } else {\n    Serial.println(\"Soil moisture is good\");\n  }\n\n  Serial.println(\"\
    ---\");\n  delay(2000);\n}\n"
  requirements: []
  wikiUrl: https://wiki.seeedstudio.com/Grove-Capacitive-Moisture-Sensor-Corrosion-Resistant/
