  code: "// Ultrasonic Distance Sensor (HC-SR04) - XIAO\n#define TRIG_PIN 2\n#define ECHO_PIN 3\n\nvoid setup() {\n  Serial.begin(115200);\n  while (!Serial) { delay(10); }\n  pinMode(TRIG_PIN, OUTPUT);\n\
    \  pinMode(ECHO_PIN, INPUT);\n  Serial.println(\"HC-SR04 Ultrasonic Distance Sensor\");\n}\n\nvoid loop() {\n  // Send trigger pulse\n  digitalWrite(TRIG_PIN, LOW);\n  delayMicroseconds(2);\n  digitalWrite(TRIG_PIN,\
    \ HIGH);\n  delayMicroseconds(10);\n  digitalWrite(TRIG_PIN, LOW);\n\n  // Measure echo duration\n  long duration = pulseIn(ECHO_PIN, HIGH, 30000);\n\n  if (duration == 0) {\n    Serial.println(\"Out\
    \ of range\");\n  } else {\n    // Calculate distance in cm (speed of sound = 343 m/s)\n    float distanceCm = duration * 0.0343 / 2.0;\n    Serial.print(\"Distance: \"); Serial.print(distanceCm, 1);\
    \ Serial.println(\" cm\");\n  }\n\n  delay(200);\n}\n"
  requirements: []
  wikiUrl: https://wiki.seeedstudio.com/Grove-Ultrasonic_Ranger/
