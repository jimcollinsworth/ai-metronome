  code: "// BME280 Environmental Sensor - XIAO\n#include <Wire.h>\n#include <Adafruit_BME280.h>\n\nAdafruit_BME280 bme;\n\nvoid setup() {\n  Serial.begin(115200);\n  while (!Serial) { delay(10); }\n\n \
    \ if (!bme.begin(0x76)) {\n    Serial.println(\"Could not find BME280 sensor at 0x76, trying 0x77...\");\n    if (!bme.begin(0x77)) {\n      Serial.println(\"BME280 not found! Check wiring.\");\n  \
