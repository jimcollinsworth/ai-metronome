- id: i2c-scanner-arduino
  title: I2C Scanner
  description: Scan the I2C bus and list all connected devices
  language: arduino
  boards:
  - esp32c3
  - esp32s3
  - esp32s3-sense
  - esp32c6
  - rp2040
  - rp2350
  - nrf52840
  - nrf52840-sense
  - samd21
  - ra4m1
  - mg24
  - mg24-sense
  category: sensors
  tags:
  - i2c
  - scanner
  - wire
  - bus
  - debug
  - address
  code: "// I2C Scanner - XIAO Boards\n#include <Wire.h>\n\nvoid setup() {\n  Serial.begin(115200);\n  while (!Serial) { delay(10); }\n  Serial.println(\"\\nI2C Scanner\");\n\n  Wire.begin();\n}\n\nvoid\
    \ loop() {\n  Serial.println(\"Scanning...\");\n\n  int deviceCount = 0;\n  for (byte address = 1; address < 127; address++) {\n    Wire.beginTransmission(address);\n    byte error = Wire.endTransmission();\n\
    \n    if (error == 0) {\n      Serial.print(\"Device found at 0x\"); Serial.print(address, HEX); Serial.println();\n      deviceCount++;\n    }\n  }\n\n  if (deviceCount == 0) {\n    Serial.println(\"\
    No I2C devices found!\");\n  } else {\n    Serial.print(\"Found \"); Serial.print(deviceCount); Serial.println(\" device(s)\");\n  }\n\n  delay(5000);\n}\n"
  requirements: []
  wikiUrl: https://wiki.seeedstudio.com/SeeedStudio_XIAO_Series_Introduction/
