    \ / 100.0F, 2);  Serial.println(\" hPa\"); Serial.print(\"Altitude: \"); Serial.print(bme.readAltitude(1013.25), 2);  Serial.println(\" m\"); Serial.println(\"---\");\n  delay(2000);\n}\n"
