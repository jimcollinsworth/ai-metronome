  code: "// Light Sensor (LDR) - XIAO\n// Connect LDR with a voltage divider to A0\n\n#define LDR_PIN A0\n\nvoid setup() {\n  Serial.begin(115200);\n  while (!Serial) { delay(10); }\n  Serial.println(\"\
    LDR Light Sensor Example\");\n  Serial.println(\"Higher value = more light\");\n}\n\nvoid loop() {\n  int rawValue = analogRead(LDR_PIN);\n\n  // Approximate lux mapping (varies with resistor and LDR)\n\
    \  // Using a simple linear approximation for demonstration\n  float voltage = rawValue * (3.3 / 4095.0);\n  int lightPercent = map(rawValue, 0, 4095, 0, 100);\n\n  Serial.print(\"Raw: \"); Serial.print(rawValue);\
    \ Serial.print(\" | Voltage: \"); Serial.print(voltage, 2); Serial.print(\" V | Light: \"); Serial.print(lightPercent); Serial.print(\"%\"); Serial.println();\n\n  if (lightPercent < 20) {\n    Serial.println(\"\
    Environment: Dark\");\n  } else if (lightPercent < 60) {\n    Serial.println(\"Environment: Indoor / Dim\");\n  } else {\n    Serial.println(\"Environment: Bright / Outdoor\");\n  }\n\n  Serial.println(\"\
    ---\");\n  delay(1000);\n}\n"
  requirements: []
