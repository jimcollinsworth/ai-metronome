[project]
name = "ai-metronome"
version = "0.1.0"
description = "[Project description in progress]"
readme = "README.md"
authors = [
    { name = "Jim Collinsworth", email = "jimcollinsworth@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "bleak>=3.0.2",
]

[project.scripts]
ai-metronome = "ai_metronome:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_metronome", "tools"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
python_files = ["test_*.py"]
norecursedirs = ["archive", ".venv", ".git"]
asyncio_mode = "auto"
